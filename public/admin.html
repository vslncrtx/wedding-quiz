<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пульт управления</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    button { padding: 20px; font-size: 20px; border-radius: 12px; border: none; cursor: pointer; }
    .next { background: #10b981; color: white; }
    .prev { background: #6b7280; color: white; }
    .reset { background: #ef4444; color: white; }
  </style>
</head>
<body>
  <h2>Пульт викторины</h2>
  <button class="next" onclick="socket.emit('admin-next')">👉 Следующий вопрос</button>
  <button class="prev" onclick="socket.emit('admin-prev')">👈 Предыдущий вопрос</button>
  <button class="reset" onclick="socket.emit('admin-reset')">🔄 Сбросить голоса</button>

  <script>
    const socket = io();
  </script>
</body>
</html>
